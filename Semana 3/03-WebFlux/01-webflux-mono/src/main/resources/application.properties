spring.application.name=webflux-mono
server.port=8074

# Deja ver en el log el nombre del hilo que atiende cada peticion.
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%15.15t]){magenta} %clr(%-40.40logger{39}){cyan} : %msg%n
logging.level.com.academymty=INFO

# Sin esto, Spring Boot borra el "message" del JSON de error y el motivo del 404
# se pierde: veriamos el status pero no "No existe el empleado 999". El valor por
# defecto es "never" para no filtrar detalles internos al cliente; aqui lo abrimos
# porque el curso necesita ver el mensaje.
#
# OJO CON EL PREFIJO: en Boot 3 esto era server.error.include-message. En Boot 4
# se llama spring.web.error.include-message. El nombre viejo NO da error ni aviso:
# Boot lo ignora en silencio y sigues viendo el 404 sin mensaje, como si nada.
spring.web.error.include-message=always
