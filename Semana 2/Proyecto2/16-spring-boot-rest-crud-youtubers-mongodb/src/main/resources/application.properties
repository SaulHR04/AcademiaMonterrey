#
# MongoDB properties
#
# OJO: en Spring Boot 4 el prefijo es "spring.mongodb", NO "spring.data.mongodb".
# La propiedad spring.data.mongodb.uri quedo deprecada a nivel error desde la
# version 4.0.0 y se IGNORA EN SILENCIO: la app arranca, guarda y lee sin fallar,
# pero contra la base por defecto ("test") en vez de la tuya.
#
spring.mongodb.uri=mongodb://localhost:27017/employee_directory

#
# Puerto distinto al del proyecto 15 (MySQL), para poder correr ambos a la vez
#
server.port=8081
